<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Be One w/the Slop</title>
  <meta name="description"
    content="Enter the glow and play Game Studio Simulator.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Be One w/the Slop">
  <meta property="og:description"
    content="Enter the glow and play Game Studio Simulator.">
  <meta property="og:url" content="https://mxcl.dev">
  <meta property="og:image" content="https://mxcl.dev/images/be-one-sword.webp">
  <meta name="theme-color" content="#090616">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&family=Sora:wght@300;400;600;800&display=swap">
  <style>
    :root {
      --bg-ink: #06040d;
      --bg-violet: #1a1030;
      --glow-pink: #f743d2;
      --glow-cyan: #47d9ff;
      --glow-sand: #fff1cb;
      --panel: rgba(7, 7, 18, 0.72);
      --text: #f4f5ff;
      --muted: #b8bada;
      --border: rgba(241, 246, 255, 0.2);
      --shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      background: radial-gradient(circle at 80% 5%, #3a1566 0%, #0f0a1d 28%,
        #090611 56%, #06040d 100%);
      color: var(--text);
      font-family: "Sora", "Avenir Next", "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(1.2rem, 4vw, 2.6rem);
      overflow-x: hidden;
      position: relative;
      isolation: isolate;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 55vmax;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.25;
      z-index: -2;
      animation: orbit 38s linear infinite;
      pointer-events: none;
    }

    body::before {
      left: -14vmax;
      top: -16vmax;
      background: radial-gradient(circle at 40% 40%, var(--glow-cyan),
        transparent 64%);
    }

    body::after {
      right: -14vmax;
      bottom: -20vmax;
      animation-direction: reverse;
      animation-duration: 50s;
      background: radial-gradient(circle at 40% 40%, var(--glow-pink),
        transparent 65%);
    }

    .site {
      width: min(1080px, 100%);
      display: grid;
      grid-template-columns: minmax(280px, 1.1fr) minmax(260px, 0.9fr);
      gap: clamp(1rem, 3vw, 2rem);
      background: linear-gradient(140deg, rgba(11, 9, 23, 0.86),
        rgba(10, 8, 19, 0.7));
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      overflow: clip;
    }

    .visual {
      padding: clamp(1rem, 2.2vw, 1.8rem);
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, rgba(18, 14, 36, 0.85),
        rgba(8, 8, 19, 0.55));
    }

    .hero-link {
      width: min(100%, 460px);
      display: block;
      position: relative;
      border-radius: 24px;
      outline: none;
      transition: transform 260ms ease;
    }

    .hero-link:hover,
    .hero-link:focus-visible {
      transform: translateY(-4px) scale(1.01);
    }

    .hero-link::before,
    .hero-link::after {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 28px;
      z-index: -1;
      pointer-events: none;
    }

    .hero-link::before {
      background: conic-gradient(from 0deg, rgba(247, 67, 210, 0),
        rgba(247, 67, 210, 0.5), rgba(71, 217, 255, 0.52),
        rgba(255, 241, 203, 0.36), rgba(247, 67, 210, 0));
      filter: blur(14px);
      opacity: 0.65;
      animation: spin 18s linear infinite;
    }

    .hero-link::after {
      background: radial-gradient(circle at 50% 20%, rgba(255, 241, 203, 0.25),
        rgba(247, 67, 210, 0.1) 45%, transparent 75%);
      animation: pulse 9s ease-in-out infinite;
    }

    .poster {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 28px 46px rgba(2, 0, 8, 0.62);
    }

    .content {
      padding: clamp(1.4rem, 4vw, 2.8rem) clamp(1.2rem, 3vw, 2.1rem);
      display: grid;
      align-content: center;
      gap: 1.25rem;
      background: linear-gradient(180deg, rgba(10, 10, 22, 0.6),
        rgba(8, 8, 17, 0.85));
    }

    .eyebrow {
      color: var(--glow-cyan);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-family: "Chakra Petch", "Eurostile", sans-serif;
      font-size: 0.78rem;
      text-shadow: 0 0 14px rgba(71, 217, 255, 0.42);
    }

    h1 {
      font-size: clamp(2rem, 4.3vw, 3.3rem);
      line-height: 1.06;
      font-weight: 800;
      letter-spacing: 0.01em;
      text-wrap: balance;
      text-shadow: 0 0 28px rgba(247, 67, 210, 0.28);
    }

    .accent {
      color: var(--glow-sand);
      text-shadow: 0 0 18px rgba(255, 241, 203, 0.5);
      font-style: italic;
    }

    p {
      color: var(--muted);
      max-width: 42ch;
      line-height: 1.65;
      font-size: clamp(0.95rem, 2vw, 1.08rem);
      text-wrap: pretty;
    }

    .actions {
      display: flex;
      gap: 0.9rem;
      flex-wrap: wrap;
      margin-top: 0.25rem;
    }

    .btn {
      text-decoration: none;
      border-radius: 999px;
      padding: 0.78rem 1.25rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: transform 200ms ease, box-shadow 200ms ease,
        background-color 200ms ease;
      font-size: 0.95rem;
    }

    .btn-primary {
      color: #05050d;
      background: linear-gradient(100deg, var(--glow-sand), #fcd8ff);
      box-shadow: 0 8px 28px rgba(247, 67, 210, 0.34);
    }

    .btn-secondary {
      color: var(--text);
      background: var(--panel);
      border: 1px solid rgba(71, 217, 255, 0.35);
      box-shadow: inset 0 0 0 1px rgba(71, 217, 255, 0.08);
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(6, 4, 18, 0.45);
    }

    .foot-note {
      color: rgba(198, 202, 231, 0.85);
      font-size: 0.83rem;
      letter-spacing: 0.02em;
      margin-top: 0.2rem;
    }

    @media (max-width: 900px) {
      .site {
        grid-template-columns: 1fr;
      }

      .content {
        text-align: center;
        justify-items: center;
      }

      .actions {
        justify-content: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.58;
      }

      50% {
        opacity: 0.9;
      }
    }

    @keyframes orbit {
      from {
        transform: rotate(0deg) scale(1);
      }

      50% {
        transform: rotate(180deg) scale(1.06);
      }

      to {
        transform: rotate(360deg) scale(1);
      }
    }
  </style>
</head>
<body>
  <main class="site">
    <section class="visual">
      <a class="hero-link" href="https://gamestudiosimulator.com" target="_blank"
        rel="noopener noreferrer" aria-label="Open Game Studio Simulator">
        <img class="poster" src="images/be-one-sword.webp"
          alt="Be One w/the Slop key art glowing in neon style">
      </a>
    </section>

    <section class="content">
      <p class="eyebrow">Game Studio Simulator</p>
      <h1>Be One with the <span class="accent">Slop</span></h1>
      <p>
        The whole vibe points to one destination. Follow the glow, click through,
        and dive into <strong>Game Studio Simulator</strong>.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="https://gamestudiosimulator.com"
          target="_blank" rel="noopener noreferrer">Launch Game Studio Simulator</a>
        <a class="btn btn-secondary" href="https://gamestudiosimulator.com"
          target="_blank" rel="noopener noreferrer">Visit Official Site</a>
      </div>

      <p class="foot-note">
        Every major interaction on this page routes to
        gamestudiosimulator.com.
      </p>
    </section>
  </main>
</body>
</html>
